name: Build LifeXP icon pack

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run discovery or build the reviewed pack'
        required: true
        type: choice
        options:
          - discover
          - build
        default: discover
      source_zip:
        description: 'Repository path to the original icon ZIP'
        required: true
        type: string
        default: assets/source/game-icons/game-icons.zip
      selection_manifest:
        description: 'Repository path to the reviewed selection manifest'
        required: false
        type: string
        default: assets/icon-pack/selection.json

permissions:
  contents: read

jobs:
  build:
    name: Validate and package icons
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Discover source ZIP
        if: inputs.mode == 'discover'
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
        run: |
          set -euo pipefail
          node tools/build_icon_pack.js \
            --mode discover \
            --source "$SOURCE_ZIP" \
            --out dist/icon-pack-discovery

      - name: Build reviewed icon pack
        if: inputs.mode == 'build'
        env:
          SOURCE_ZIP: ${{ inputs.source_zip }}
          SELECTION_MANIFEST: ${{ inputs.selection_manifest }}
        run: |
          set -euo pipefail
          node tools/build_icon_pack.js \
            --mode build \
            --source "$SOURCE_ZIP" \
            --manifest "$SELECTION_MANIFEST" \
            --out dist/icon-pack

      - name: Upload discovery or pack artifact
        uses: actions/upload-artifact@v4
        with:
          name: lifexp-icon-pack-${{ inputs.mode }}
          path: dist
          if-no-files-found: error
          retention-days: 14
